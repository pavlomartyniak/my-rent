# Blueprint для Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: my-rent-api
    runtime: node
    rootDir: backend
    # Frankfurt — найближче до Європи; оберіть той самий регіон, де кластер MongoDB Atlas
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_DB
        value: my-rent
      # Рядок підключення вводиться вручну в панелі Render і не зберігається в репозиторії
      - key: MONGODB_URI
        sync: false
      # Render згенерує випадковий секрет; його зміна завершить усі сесії
      - key: JWT_SECRET
        generateValue: true
      # Cloudinary для фото авто; значення вводяться в панелі Render
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # false: вимикає перемикач Pro без оплати. Для тестування можна тимчасово поставити true
      - key: DEMO_MODE
        value: "false"
